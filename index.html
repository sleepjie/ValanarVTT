<script>
// If something stops the page starting, say so (rather than leaving it blank), with a way to clear what this browser
// has saved for the site (remembered pages, views and settings), which is the usual culprit after an update.
(function () {
  var shown = false;
  function show(msg) {
    if (shown || window.VALANAR_STARTED) return; shown = true;
    var go = function () {
      var box = document.createElement('div');
      box.id = 'startfail';
      box.style.cssText = 'position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:99999;max-width:520px;background:#fff;color:#222;border:1px solid #c33;border-radius:8px;padding:14px 18px;font:14px system-ui,sans-serif;box-shadow:0 6px 30px rgba(0,0,0,.3)';
      box.innerHTML = '<b>This page didn\u2019t finish loading.</b><div style="margin:6px 0 10px;color:#666;font-size:12px;word-break:break-word"></div>'
        + '<button style="padding:6px 12px;cursor:pointer">Clear this browser\u2019s saved settings for the site and reload</button>';
      box.querySelector('div').textContent = msg;
      box.querySelector('button').onclick = function () {
        try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (/^(valanar|vtt)/i.test(k)) localStorage.removeItem(k); } } catch (e) { /* blocked */ }
        try { sessionStorage.clear(); } catch (e) { /* blocked */ }
        location.reload();
      };
      document.body.appendChild(box);
    };
    if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
  }
  // only if the page then never finished starting (an error it gets past is no reason to worry anyone)
  var first = '';
  window.addEventListener('error', function (e) { if (e.filename && e.filename.indexOf(location.origin) !== 0) return; if (e.message && !first) first = e.message + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : ''); });
  window.addEventListener('unhandledrejection', function (e) { if (!first) first = String(e.reason && e.reason.message || e.reason); });
  window.addEventListener('load', function () { setTimeout(function () { if (!window.VALANAR_STARTED) show(first || 'The page stopped while starting.'); }, 2500); });
})();
</script>
<script src="data/icons.js"></script><!-- list of icon images -->
<script>
// The main world map, or another version of it (?atlas=<id>: a campaign's map for another time, from the server).
(function () {
  var q = new URLSearchParams(location.search), a = q.get('atlas') || '';
  window.VALANAR_ATLAS_ID = /^a[a-f0-9]{12}$/.test(a) ? a : '';
  // placed icons, types, unplaced list, nations, borders
  document.write('<script src="data/markers.js' + (window.VALANAR_ATLAS_ID ? '?atlas=' + window.VALANAR_ATLAS_ID : '') + '"><\/script>');
})();
</script>
<script>
// Its picture: the main tiles, or maps/<folder>/ made by make_tiles.bat (the image size, the land mask for the sea and borders)
(function () {
  var t = (window.VALANAR_ATLAS && window.VALANAR_ATLAS.tiles) || '';
  if (!/^[a-z0-9_-]{1,60}$/i.test(t)) t = '';
  window.VALANAR_TILES = t ? 'maps/' + t + '/' : '';
  var w = function (src) { document.write('<script src="' + src + '"><\/script>'); };
  w(t ? 'maps/' + t + '/mapinfo.js' : 'mapinfo.js');
  w(t ? 'maps/' + t + '/land.js' : 'data/land.js');
  if (!window.VALANAR_ATLAS_ID) w('data/import.js');   // one-off import from Wonderdraft; ignored once saved
})();
</script>
